# Сборка лаунчера под macOS (Universal: Apple Silicon + Intel).
#
# Запуск: руками (Actions → macOS build → Run workflow) или пушем в ветку
# macos — так можно собрать невыпущенный код, не трогая main. Готовый .dmg и
# архив обновления лежат в артефактах прогона (aciron-launcher-macos).
#
# Секреты репозитория:
#   ACIRON_ID_URL, ACIRON_CF_PROXY_URL, ACIRON_CLIENT_KEY, ACIRON_PROXY_TOKEN,
#   ACIRON_MS_CLIENT_ID, ACIRON_REPORT_URL, ACIRON_LOG_URL — то же, что в
#   src-tauri/.cargo/config.toml у локальной сборки. Без них лаунчер соберётся,
#   но вход, CurseForge и отчёты о сбоях работать не будут.
#   VITE_ACIRON_ID_URL — из .env.local, обязателен.
#
# Ключа подписи обновлений здесь нет намеренно: он не покидает машину, с которой
# выпускается релиз. CI собирает архив обновления неподписанным, а подпись .sig
# ставит tools/make-latest-json.mjs при выпуске — тем же ключом, что и у Windows.
#
# Сертификата Apple нет, поэтому приложение подписано ad-hoc: скачанное из
# интернета macOS назовёт «повреждённым». После переноса в «Программы» один раз:
#   xattr -cr "/Applications/Aciron Launcher.app"

name: macOS build

on:
  workflow_dispatch:
  push:
    branches: [macos]

jobs:
  build:
    runs-on: macos-latest
    env:
      ACIRON_ID_URL: ${{ secrets.ACIRON_ID_URL }}
      ACIRON_CF_PROXY_URL: ${{ secrets.ACIRON_CF_PROXY_URL }}
      ACIRON_CLIENT_KEY: ${{ secrets.ACIRON_CLIENT_KEY }}
      ACIRON_PROXY_TOKEN: ${{ secrets.ACIRON_PROXY_TOKEN }}
      ACIRON_MS_CLIENT_ID: ${{ secrets.ACIRON_MS_CLIENT_ID }}
      ACIRON_REPORT_URL: ${{ secrets.ACIRON_REPORT_URL }}
      ACIRON_LOG_URL: ${{ secrets.ACIRON_LOG_URL }}
      # Фронт: у локальной сборки берётся из .env.local, без него vite.config.ts
      # останавливает сборку.
      VITE_ACIRON_ID_URL: ${{ secrets.VITE_ACIRON_ID_URL }}
      ACIRON_CHANNEL: stable
      ACIRON_BUILD_CHANNEL: stable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Свой архив обновления tauri собирает только вместе с подписью, а ключа
      # тут нет — поэтому выключаем и упаковываем .app сами, ниже.
      - name: Build
        run: |
          npx tauri build --target universal-apple-darwin \
            --config '{"bundle":{"createUpdaterArtifacts":false}}'

      # Тот же формат, что у tauri: .app в корне tar.gz. Имя с версией — как у
      # установщика Windows, чтобы релизы не затирали файл друг друга на зеркале.
      # COPYFILE_DISABLE: без него macOS кладёт в архив служебные ._-файлы.
      - name: Updater archive
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cd src-tauri/target/universal-apple-darwin/release/bundle/macos
          COPYFILE_DISABLE=1 tar -czf "Aciron.Launcher_${VERSION}_universal.app.tar.gz" "Aciron Launcher.app"

      - uses: actions/upload-artifact@v4
        with:
          name: aciron-launcher-macos
          if-no-files-found: error
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
