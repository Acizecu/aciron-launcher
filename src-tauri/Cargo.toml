[package]
name = "aciron-launcher"
version = "0.1.0"
description = "Aciron Minecraft Launcher"
authors = ["acizecu"]
edition = "2021"

[lib]
name = "aciron_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Только одно окно лаунчера: повторный запуск фокусирует уже открытое.
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
# stream — потоковая загрузка (bytes_stream), нужна чтобы рвать соединение при отмене
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
zip = "2"
md5 = "0.7"
base64 = "0.22"
sha2 = "0.10"
hmac = "0.12"
rand = "0.8"
discord-rich-presence = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
# Декодирование PNG для авто-детекта модели скина (slim/classic).
image = { version = "0.25", default-features = false, features = ["png"] }
# SHA1 для сверки целостности загрузок с манифестом Mojang.
sha1 = "0.10"

# DPAPI для шифрования токенов на диске (CryptProtectData/CryptUnprotectData).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Security_Cryptography",
    "Win32_Foundation",
] }
